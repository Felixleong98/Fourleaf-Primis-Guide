<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🍀 Location Guide — Fourleaf Primis</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="hero small-hero"><nav class="nav wrap"><a class="brand" href="index.html">🍀 Fourleaf Reborn</a><div class="navlinks"><a href="index.html#quests">Quests</a><a href="index.html#tracker">Tracker</a><a href="rewards.html">Rewards</a><a href="npcs.html">NPCs</a></div></nav><div class="hero-inner wrap"><div class="badge">LOCATION REFERENCE</div><h1>Location Guide</h1><p class="hero-text">Browse Primis areas and jump to their quests.</p></div></header><main class="wrap"><section class="section"><div id="o" class="region-grid"></div></section></main><script src="assets/database.js"></script><script>const m={};primisQuests.forEach(q=>(m[q.region]??=[]).push(q));document.getElementById("o").innerHTML=Object.entries(m).sort().map(([r,q])=>'<a class="region-card location-card" href="index.html?region='+encodeURIComponent(r)+'#quests"><span>📍</span><b>'+r+'</b><small>'+q.length+' quest entries • '+[...new Set(q.map(x=>x.npc))].length+' NPCs</small></a>').join("");</script></body></html>
