<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🍀 NPC Directory — Fourleaf Primis</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="hero small-hero"><nav class="nav wrap"><a class="brand" href="index.html">🍀 Fourleaf Reborn</a><div class="navlinks"><a href="index.html#quests">Quests</a><a href="index.html#tracker">Tracker</a><a href="rewards.html">Rewards</a><a href="locations.html">Locations</a></div></nav><div class="hero-inner wrap"><div class="badge">NPC REFERENCE</div><h1>NPC Directory</h1><p class="hero-text">Find NPCs and every quest they give.</p></div></header><main class="wrap"><section class="section"><div class="controls database-controls"><input id="s" placeholder="Search NPCs..."></div><div id="o" class="database-grid"></div></section></main><script src="assets/database.js"></script><script>const a=primisQuests,s=document.getElementById("s"),o=document.getElementById("o"),sl=q=>(q.id?String(q.id).padStart(2,"0")+"-"+q.name:q.type+"-"+q.name).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");function d(){let x=s.value.toLowerCase().trim(),m={};a.filter(q=>!x||q.npc.toLowerCase().includes(x)).forEach(q=>(m[q.npc]??=[]).push(q));o.innerHTML=Object.entries(m).sort().map(([n,qs])=>'<article class="database-card npc-card"><span class="db-tag">'+qs[0].region+'</span><h3>👤 '+n+'</h3><small>'+qs.length+' quest'+(qs.length===1?'':'s')+'</small><div class="db-links">'+qs.map(q=>'<a href="quests/'+sl(q)+'.html">'+q.name+'</a>').join("")+'</div></article>').join("")||'<div class="empty">No NPCs found.</div>'}s.oninput=d;d();</script></body></html>
