<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🍀 Reward Database — Fourleaf Primis</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="hero small-hero"><nav class="nav wrap"><a class="brand" href="index.html">🍀 Fourleaf Reborn</a><div class="navlinks"><a href="index.html#quests">Quests</a><a href="index.html#tracker">Tracker</a><a href="npcs.html">NPCs</a><a href="locations.html">Locations</a></div></nav><div class="hero-inner wrap"><div class="badge">REWARD REFERENCE</div><h1>Reward Database</h1><p class="hero-text">Search rewards and see which Primis quests provide them.</p></div></header><main class="wrap"><section class="section"><div class="controls database-controls"><input id="s" placeholder="Search rewards..."></div><div id="o" class="database-grid"></div></section></main><script src="assets/database.js"></script><script>const a=primisQuests,s=document.getElementById("s"),o=document.getElementById("o"),sl=q=>(q.id?String(q.id).padStart(2,"0")+"-"+q.name:q.type+"-"+q.name).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");function d(){let x=s.value.toLowerCase().trim();o.innerHTML=a.filter(q=>!x||q.reward.toLowerCase().includes(x)).map(q=>'<a class="database-card" href="quests/'+sl(q)+'.html"><span class="db-tag">'+q.type.toUpperCase()+'</span><h3>'+q.reward+'</h3><b>'+q.name+'</b><small>'+q.region+' • '+q.npc+'</small></a>').join("")||'<div class="empty">No rewards found.</div>'}s.oninput=d;d();</script></body></html>
