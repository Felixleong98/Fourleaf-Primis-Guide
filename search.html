<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🍀 Wiki Search — Fourleaf Primis</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="hero" style="min-height:330px"><nav class="nav wrap"><a class="brand" href="index.html">🍀 Fourleaf Reborn</a><div class="navlinks"><a href="index.html#quests">Quests</a><a href="index.html#tracker">Tracker</a><a href="regions.html">Regions</a></div></nav><div class="hero-inner wrap"><div class="badge">FOURLEAF PRIMIS WIKI</div><h1>Wiki Search</h1><p class="hero-text">Search quests, NPCs, regions, prerequisites and rewards.</p></div></header><main class="wrap"><section class="section"><input id="q" class="wiki-search controls input" style="display:block;width:100%;background:#101610;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:14px" placeholder="Search e.g. Ice Village, Navita, Elite Scraps..."><div id="results"></div></section></main><script src="assets/app.js"></script><script>const input=document.getElementById("q"),out=document.getElementById("results");function go(){const s=input.value.toLowerCase().trim();if(!s){out.innerHTML="<p class='muted'>Start typing to search the Primis database.</p>";return}const a=quests.filter(x=>[x.name,x.region,x.npc,x.pre,x.reward,x.objective].join(" ").toLowerCase().includes(s));out.innerHTML=a.map(x=>{const slug=(x.id?String(x.id).padStart(2,"0")+"-"+x.name:x.type+"-"+x.name).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");return '<a class="search-result" href="quests/'+slug+'.html"><b>'+x.name+'</b><br><small>'+x.type.toUpperCase()+' • '+x.region+' • '+x.npc+'</small><br><span>'+x.reward+'</span></a>'}).join("")||"<p class='muted'>No matching quests.</p>"}input.addEventListener("input",go);go();</script></body></html>
